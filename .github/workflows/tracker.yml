name: SNITCH X Background Tracker

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "public/tracker-db.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: snitch-x-tracker
  cancel-in-progress: true

jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SNITCH X full background worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram }}
          BINANCE_SPOT_TAKER_FEE_BPS: 10
          BINANCE_FUTURES_TAKER_FEE_BPS: 5
          BINANCE_MARGIN_TAKER_FEE_BPS: 10
          SNITCH_TRADE_NOTIONAL_USD: 10
          SNITCH_MIN_NET_PROFIT_USD: 0.50
          SNITCH_ENABLE_DEX_LEGACY: "true"
        run: node scripts/tracker-worker.mjs

      - name: Commit tracker database
        run: |
          git config user.name "snitch-x-bot"
          git config user.email "actions@github.com"

          git add public/tracker-db.json

          if git diff --cached --quiet; then
            echo "No tracker changes"
            exit 0
          fi

          git commit -m "Update SNITCH X tracker database"

          # Remote may have newer commits if you pushed while this workflow was running.
          # Rebase the bot commit on top of latest remote before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
